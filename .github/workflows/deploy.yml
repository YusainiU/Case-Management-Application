
name: Prepare Laravel deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: case-management-deployment
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Create release archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=storage \
            --exclude=vendor \
            -czf release.tar.gz .

      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          test -s ~/.ssh/deploy_key
          test -s ~/.ssh/known_hosts
          test -n "$DEPLOY_HOST"

      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/case-management-deploy/release.tar.gz"

      - name: Extract and prepare release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          BASE="/var/www/case-management-deploy"
          RELEASE="$BASE/releases/$RELEASE_ID"

          mkdir -p "$BASE/releases"
          test -d "$BASE/shared"
          test -f "$BASE/shared/.env"
          test -d "$BASE/shared/storage"

          if [ -e "$RELEASE" ]; then
            echo "Release already exists; refusing to overwrite it."
            exit 1
          fi

          mkdir -p "$RELEASE"
          tar -xzf "$BASE/release.tar.gz" -C "$RELEASE"
          rm -f "$BASE/release.tar.gz"

          ln -s "$BASE/shared/.env" "$RELEASE/.env"
          ln -s "$BASE/shared/storage" "$RELEASE/storage"

          mkdir -p "$RELEASE/bootstrap/cache"
          mkdir -p "$RELEASE/shared-placeholder"

          chown -R yusdeploy:www-data "$RELEASE"
          chmod -R g+rX "$RELEASE"

          echo "Release prepared: $RELEASE"
          echo "The live website has not been switched."
          REMOTE

      - name: Report prepared release
        run: echo "Release prepared. The live website remains unchanged."

