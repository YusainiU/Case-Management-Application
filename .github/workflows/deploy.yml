
name: Prepare Laravel deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: case-management-deployment
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies for frontend build
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Create release archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=storage \
            --exclude=vendor \
            -czf "$RUNNER_TEMP/release.tar.gz" .

      - name: Prepare SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          test -s ~/.ssh/deploy_key
          test -s ~/.ssh/known_hosts
          test -n "$DEPLOY_HOST"

      - name: Verify SSH key
        run: |
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/github-deploy-public-key
          ssh-keygen -lf /tmp/github-deploy-public-key

      - name: Upload release archive
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/release.tar.gz" \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/case-management-deploy/release.tar.gz"

      - name: Extract and prepare release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          BASE="/var/www/case-management-deploy"
          RELEASE="$BASE/releases/$RELEASE_ID"

          mkdir -p "$BASE/releases"

          test -d "$BASE/shared"
          test -f "$BASE/shared/.env"
          test -d "$BASE/shared/storage"
          test -d "$BASE/shared/storage/app/public"

          if [ -e "$RELEASE" ]; then
            echo "Release already exists. Refusing to overwrite it."
            exit 1
          fi

          mkdir -p "$RELEASE"
          tar -xzf "$BASE/release.tar.gz" -C "$RELEASE"
          rm -f "$BASE/release.tar.gz"

          chown -R yusdeploy:www-data "$RELEASE"
          chmod -R g+rX "$RELEASE"

          ln -s "$BASE/shared/.env" "$RELEASE/.env"
          ln -s "$BASE/shared/storage" "$RELEASE/storage"

          mkdir -p "$RELEASE/bootstrap/cache"
          chown -R yusdeploy:www-data "$RELEASE/bootstrap/cache"
          chmod -R 2775 "$RELEASE/bootstrap/cache"

          if [ ! -e "$RELEASE/public/storage" ] && [ ! -L "$RELEASE/public/storage" ]; then
            ln -s "$BASE/shared/storage/app/public" "$RELEASE/public/storage"
          else
            echo "Unexpected public/storage already exists."
            exit 1
          fi

          echo "Installing PHP dependencies with PHP 8.5..."

          cd "$RELEASE"
          php8.5 "$(command -v composer)" install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

          echo "Checking Laravel installation..."
          php8.5 artisan --version

          echo "Release prepared successfully: $RELEASE"
          echo "The live website has NOT been switched."
          REMOTE

      - name: Activate and verify release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$RELEASE_ID' bash -s" <<'REMOTE'
          set -euo pipefail

          BASE="/var/www/case-management-deploy"
          RELEASE="$BASE/releases/$RELEASE_ID"
          CURRENT="$BASE/current"
          PREVIOUS="$BASE/previous"

          echo "Checking the new release..."

          if [ ! -d "$RELEASE" ]; then
            echo "ERROR: New release directory does not exist."
            exit 1
          fi

          if [ ! -L "$CURRENT" ] || [ ! -d "$CURRENT" ]; then
            echo "ERROR: Current release symlink is missing or invalid."
            exit 1
          fi

          OLD_RELEASE="$(readlink -f "$CURRENT")"

          case "$OLD_RELEASE" in
            "$BASE"/releases/*)
              ;;
            *)
              echo "ERROR: Current release points outside the releases directory."
              exit 1
              ;;
          esac

          echo "Previous live release: $OLD_RELEASE"
          echo "New release: $RELEASE"

          echo "Activating new release..."

          NEXT_LINK="$BASE/current.next.$$"
          ln -s "$RELEASE" "$NEXT_LINK"
          mv -Tf "$NEXT_LINK" "$CURRENT"

          echo "New release activated."
          echo "Checking the live HTTPS website..."

          HEALTHY=false

          for attempt in {1..10}; do
            HTTP_CODE="$(curl \
              --location \
              --connect-timeout 5 \
              --max-time 15 \
              -sS -o /dev/null \
              -w '%{http_code}' \
              https://yusaini-usulludin.info/case-management/ || true)"

            echo "Health check $attempt/10: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              HEALTHY=true
              break
            fi

            sleep 5
          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: New release failed the health check."
            echo "Rolling back to the previous release..."

            ROLLBACK_LINK="$BASE/current.rollback.$$"
            ln -s "$OLD_RELEASE" "$ROLLBACK_LINK"
            mv -Tf "$ROLLBACK_LINK" "$CURRENT"

            echo "Rollback completed."
            echo "Current release: $(readlink -f "$CURRENT")"

            exit 1
          fi

          echo "Health check passed."

          echo "Recording previous release for future rollback..."

          PREVIOUS_NEXT="$BASE/previous.next.$$"
          ln -s "$OLD_RELEASE" "$PREVIOUS_NEXT"
          mv -Tf "$PREVIOUS_NEXT" "$PREVIOUS"

          echo "Deployment successful."
          echo "Active release: $(readlink -f "$CURRENT")"
          echo "Previous release: $(readlink -f "$PREVIOUS")"
          REMOTE

      - name: Clean up old releases
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'bash -s' <<'REMOTE'
          set -euo pipefail

          BASE="/var/www/case-management-deploy"
          RELEASES_DIR="$BASE/releases"
          CURRENT="$BASE/current"
          PREVIOUS="$BASE/previous"

          echo "Checking release directory..."

          if [ ! -d "$RELEASES_DIR" ]; then
            echo "ERROR: Releases directory does not exist."
            exit 1
          fi

          RELEASES_DIR="$(readlink -f "$RELEASES_DIR")"

          echo "Checking current release..."

          if [ ! -L "$CURRENT" ] || [ ! -d "$CURRENT" ]; then
            echo "ERROR: Current release symlink is missing or invalid."
            exit 1
          fi

          CURRENT_RELEASE="$(readlink -f "$CURRENT")"

          case "$CURRENT_RELEASE" in
            "$RELEASES_DIR"/*)
              ;;
            *)
              echo "ERROR: Current release points outside releases directory."
              exit 1
              ;;
          esac

          if [ "$(dirname "$CURRENT_RELEASE")" != "$RELEASES_DIR" ]; then
            echo "ERROR: Current release is not a direct child of releases."
            exit 1
          fi

          echo "Protected current release: $CURRENT_RELEASE"

          echo "Checking previous release..."

          PREVIOUS_RELEASE=""

          if [ -L "$PREVIOUS" ] || [ -e "$PREVIOUS" ]; then
            if [ ! -L "$PREVIOUS" ] || [ ! -d "$PREVIOUS" ]; then
              echo "ERROR: Previous release pointer is invalid."
              exit 1
            fi

            PREVIOUS_RELEASE="$(readlink -f "$PREVIOUS")"

            case "$PREVIOUS_RELEASE" in
              "$RELEASES_DIR"/*)
                ;;
              *)
                echo "ERROR: Previous release points outside releases directory."
                exit 1
                ;;
            esac

            if [ "$(dirname "$PREVIOUS_RELEASE")" != "$RELEASES_DIR" ]; then
              echo "ERROR: Previous release is not a direct child of releases."
              exit 1
            fi

            echo "Protected previous release: $PREVIOUS_RELEASE"
          else
            echo "No previous release symlink exists yet."
          fi

          echo "Finding releases, newest first..."

          mapfile -t RELEASES < <(
            find "$RELEASES_DIR" \
              -mindepth 1 -maxdepth 1 -type d \
              -printf '%T@ %p\n' |
              sort -rn |
              cut -d' ' -f2-
          )

          echo "Total releases: ${#RELEASES[@]}"
          echo "Keeping the three newest releases, plus protected pointers."

          for i in "${!RELEASES[@]}"; do
            RELEASE="${RELEASES[$i]}"

            if [ "$i" -lt 3 ] ||
               [ "$RELEASE" = "$CURRENT_RELEASE" ] ||
               { [ -n "$PREVIOUS_RELEASE" ] && [ "$RELEASE" = "$PREVIOUS_RELEASE" ]; }; then

              echo "KEEP: $RELEASE"

            else
              if [ "$(dirname "$RELEASE")" != "$RELEASES_DIR" ] ||
                 [ ! -d "$RELEASE" ] ||
                 [ -L "$RELEASE" ]; then
                echo "ERROR: Refusing to delete unexpected path: $RELEASE"
                exit 1
              fi

              echo "DELETE: $RELEASE"
              rm -rf -- "$RELEASE"
            fi
          done

          echo "Release cleanup completed."
          echo "Active release: $(readlink -f "$CURRENT")"

          if [ -L "$PREVIOUS" ]; then
            echo "Previous release: $(readlink -f "$PREVIOUS")"
          fi
          REMOTE

      - name: Report deployment success
        run: |
          echo "Deployment completed successfully."
          echo "The new release is active."
